name: 検証環境へのDB複製（毎日）

# 毎日 JST 3:00 (UTC 18:00) に実行
# 本番(PROD_DB_URL)の内容を検証環境(DEV_DB_URL)へ複製し、
# 個人情報（メールアドレス・表示名）を匿名化する。
# Storage（画像）は対象外。テーブルのデータのみ。

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {} # 手動実行もできるようにしておく

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: PostgreSQLクライアントをインストール（v17・本番と揃える）
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Ubuntu標準のpg_dump(v16)が優先されるため、v17を明示的にPATHの先頭へ追加する
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: 使用するpg_dumpのバージョンを確認
        run: |
          which pg_dump
          pg_dump --version
          psql --version

      - name: 本番からdumpを取得
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          pg_dump "$PROD_DB_URL" \
            --no-owner --no-privileges \
            --exclude-schema=supabase_functions \
            --exclude-schema=extensions \
            --exclude-schema=graphql \
            --exclude-schema=graphql_public \
            --exclude-schema=pgbouncer \
            --exclude-schema=realtime \
            --exclude-schema=supabase_migrations \
            --exclude-schema=vault \
            --exclude-schema=net \
            --exclude-schema=storage \
            --schema=public --schema=auth \
            --clean --if-exists \
            -f prod_dump.sql

      - name: 検証環境へ復元
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          psql "$DEV_DB_URL" -v ON_ERROR_STOP=0 -f prod_dump.sql

      - name: 個人情報を匿名化
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          psql "$DEV_DB_URL" -v ON_ERROR_STOP=1 -f scripts/anonymize_dev.sql

      - name: 後片付け
        if: always()
        run: rm -f prod_dump.sql

name: 本番のバックアップと検証環境への複製（毎日）

# 毎日 JST 3:00 (UTC 18:00) に実行
# 1. 本番(PROD_DB_URL)をdumpし、Artifactsに90日分保存する（バックアップ）
# 2. その内容を検証環境(DEV_DB_URL)へ複製し、個人情報を匿名化する
# Storage（画像）は対象外。テーブルのデータのみ。
#
# 注意: Artifactsのバックアップは匿名化前の状態です（個人情報を含みます）。

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {} # 手動実行もできるようにしておく

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: PostgreSQLクライアントをインストール（v17・本番と揃える）
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Ubuntu標準のpg_dump(v16)が優先されるため、v17を明示的にPATHの先頭へ追加する
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: 使用するpg_dumpのバージョンを確認
        run: |
          which pg_dump
          pg_dump --version
          psql --version

      - name: 本番からdumpを取得
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          pg_dump "$PROD_DB_URL" \
            --no-owner --no-privileges \
            --exclude-schema=supabase_functions \
            --exclude-schema=extensions \
            --exclude-schema=graphql \
            --exclude-schema=graphql_public \
            --exclude-schema=pgbouncer \
            --exclude-schema=realtime \
            --exclude-schema=supabase_migrations \
            --exclude-schema=vault \
            --exclude-schema=net \
            --exclude-schema=storage \
            --schema=public --schema=auth \
            --clean --if-exists \
            -f prod_dump.sql

      - name: バックアップとして保存（世代を残す）
        run: |
          # 日付入りのファイル名にして、どの時点のものか分かるようにする
          STAMP=$(TZ=Asia/Tokyo date +%Y%m%d)
          gzip -c prod_dump.sql > "my-teas-backup-${STAMP}.sql.gz"
          ls -lh "my-teas-backup-${STAMP}.sql.gz"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: バックアップをArtifactsへアップロード
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: my-teas-backup-*.sql.gz
          retention-days: 90

      - name: 検証環境へ復元
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          # dumpには本番固有の拡張機能やロールに関する記述が含まれ、
          # 検証環境では実行できない行が必ず出る。そのため ON_ERROR_STOP=0 で続行する。
          # ただし黙って進むと不整合に気付けないので、エラー行を数えて表示する。
          psql "$DEV_DB_URL" -v ON_ERROR_STOP=0 -f prod_dump.sql 2> restore_errors.log || true
          echo "----- 復元時のエラー件数 -----"
          grep -c "^ERROR" restore_errors.log || echo "0"
          echo "----- 内容（先頭20件）-----"
          grep "^ERROR" restore_errors.log | head -20 || true

      - name: ロールへの権限を付け直す
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          # pg_dumpに--no-privilegesを付けているためGRANTが含まれない。
          # これが無いとアプリからデータが一切読めない（v355で発覚）。
          psql "$DEV_DB_URL" -v ON_ERROR_STOP=1 -f scripts/restore_dev_grants.sql

      - name: 個人情報を匿名化
        env:
          DEV_DB_URL: ${{ secrets.DEV_DB_URL }}
        run: |
          psql "$DEV_DB_URL" -v ON_ERROR_STOP=1 -f scripts/anonymize_dev.sql

      - name: 後片付け
        if: always()
        run: rm -f prod_dump.sql my-teas-backup-*.sql.gz restore_errors.log
